name: QA Windows installer smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/qa-windows-installer-smoke.yml"
      - "qa/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-smoke:
    name: Silent NSIS install and data marker
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the public QA repository
        uses: actions/checkout@v4
      - name: Test only the already published QA installers
        shell: pwsh
        run: ./qa/test-installer-smoke.ps1
